[project]
name = "worker-media"
version = "0.0.0"
description = "Worker de mídia do Radar Neon: FFmpeg, faster-whisper, PySceneDetect, Rhubarb (operações fechadas e tipadas)"
requires-python = "==3.11.*"
dependencies = [
  "fastapi==0.162.2",
  "uvicorn==0.54.0",
  "pydantic==2.14.3",
]

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "httpx==0.28.1",
  "ruff==0.17.4",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
